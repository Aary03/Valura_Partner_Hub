<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valura Partner Activation Hub</title>
<link rel="icon" href="assets/valura-mark-green.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Schibsted+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/hub.css">
<link rel="stylesheet" href="css/doc.css">
<style>
  /* Variable-field highlighting in the agreement */
  .vf { }
  .vf-on { background: var(--brand-tint); box-shadow: inset 0 -1px 0 var(--brand); border-radius: 2px; padding: 0 2px; }
</style>
</head>
<body>

<div class="app">
  <aside class="rail">
    <div class="rail-head">
      <div class="rail-mark">
        <img src="assets/valura-mark-white.png" alt="Valura">
        <span class="wordmark">Valura</span>
      </div>
      <div class="rail-sub">Partner<br>Activation Hub</div>
    </div>
    <nav class="rail-nav" id="rail-nav"></nav>
    <div class="rail-foot" id="rail-foot"></div>
  </aside>

  <main class="canvas">
    <header class="topbar" id="topbar"></header>
    <div id="body-view"></div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/state.js"></script>
<script src="js/economics.js"></script>
<script src="js/calendar.js"></script>
<script src="js/docs/shared.js"></script>
<script src="js/docs/agreement.js"></script>
<script src="js/docs/commercial.js"></script>
<script src="js/docs/emails.js"></script>
<script src="js/docs/collateral.js"></script>
<script src="js/docs/ops.js"></script>
<script src="js/main.js"></script>
</body>
</html>
